<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Habit Tracker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">🔥</span>
    <span class="brand-name">Habit Tracker</span>
  </div>
  <div id="user-chip" class="user-chip hidden">
    <span id="user-email"></span>
    <button id="logout-btn" class="btn btn-ghost">Log out</button>
  </div>
</header>

<main>

  <!-- AUTH VIEW -->
  <section id="auth-view" class="auth-view">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Log in</button>
        <button class="auth-tab" data-tab="signup">Sign up</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <p class="form-error" id="login-error"></p>
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>

      <form id="signup-form" class="auth-form hidden">
        <label>Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" name="password" required minlength="8" autocomplete="new-password" />
          <span class="hint">At least 8 characters</span>
        </label>
        <p class="form-error" id="signup-error"></p>
        <button type="submit" class="btn btn-primary">Create account</button>
      </form>
    </div>
  </section>

  <!-- DASHBOARD VIEW -->
  <section id="dashboard-view" class="dashboard-view hidden">

    <form id="add-habit-form" class="add-habit-card">
      <input type="text" name="name" placeholder="New habit, e.g. Drink water" required maxlength="120" />
      <input type="text" name="description" placeholder="Description (optional)" maxlength="500" />
      <button type="submit" class="btn btn-primary">+ Add habit</button>
    </form>

    <div id="empty-state" class="empty-state hidden">
      <p>No habits yet — add your first one above.</p>
    </div>

    <div id="habit-grid" class="habit-grid"></div>
  </section>

</main>

<template id="habit-card-template">
  <article class="habit-card">
    <div class="habit-card-header">
      <h3 class="habit-name"></h3>
      <button class="icon-btn delete-btn" title="Delete habit" aria-label="Delete habit">&times;</button>
    </div>
    <p class="habit-description"></p>
    <div class="streak-row">
      <div class="streak-badge current">
        <span class="streak-flame">🔥</span>
        <span class="streak-number"></span>
        <span class="streak-label">current</span>
      </div>
      <div class="streak-badge longest">
        <span class="streak-trophy">🏆</span>
        <span class="streak-number"></span>
        <span class="streak-label">best</span>
      </div>
    </div>
    <div class="heatmap"></div>
    <button class="btn btn-toggle" data-done="false">Mark today done</button>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
